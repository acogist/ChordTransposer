name: Update third-party licenses

# Adds libraries newly loaded from a CDN in public/ to
# public/chordtransposer/THIRD_PARTY_LICENSES.md and commits the change.
on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/update-third-party-licenses.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: third-party-licenses
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Add new libraries to THIRD_PARTY_LICENSES.md
        run: node scripts/update-third-party-licenses.mjs

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/chordtransposer/THIRD_PARTY_LICENSES.md
          git commit -m "THIRD_PARTY_LICENSES.md に新しいライブラリを追加"
          git push
