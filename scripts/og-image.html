<!DOCTYPE html>
<!-- Source of public/chordtransposer/og-image.png (1200x630). Regenerate with:
     node scripts/render-og-image.mjs -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #fff; color: #000;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { box-sizing: border-box; height: 100%; padding: 88px 96px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 28px; }
  .brand svg { width: 104px; height: 104px; }
  h1 { margin: 0; font-size: 76px; font-weight: 700; letter-spacing: -0.02em; }
  p { margin: 0; font-size: 34px; color: #525252; line-height: 1.4; }
  .demo { display: flex; gap: 28px; align-items: center; font-family: "DejaVu Sans Mono", monospace; font-size: 44px; }
  .demo .chips { display: flex; gap: 16px; }
  .demo span { border: 2px solid #d4d4d4; border-radius: 12px; padding: 10px 22px; }
  .demo .to { color: #737373; border: 0; padding: 0; }
  .demo .out span { background: #000; color: #fff; border-color: #000; }
  .url { font-size: 28px; color: #737373; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 28 28"><rect width="28" height="28" rx="7"/><g fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"><path d="M11 7v14M17 7v14M8 12.5l12-2.5M8 18.5l12-2.5"/></g></svg>
      <h1>Chord Transposer</h1>
    </div>
    <p>Transpose chord charts in your browser.<br />Paste text or open TXT, PDF, and image files.</p>
    <div class="demo">
      <div class="chips"><span>C</span><span>Am7</span><span>F/G</span></div>
      <span class="to">→ +2 →</span>
      <div class="chips out"><span>D</span><span>Bm7</span><span>G/A</span></div>
    </div>
    <div class="url">ktkwmr.com/chordtransposer</div>
  </div>
</body>
</html>
